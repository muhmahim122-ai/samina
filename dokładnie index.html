<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Samina 💝</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* মূল কার্ডের এনিমেশন */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 10;
            animation: zoomIn 1.5s ease-out;
        }

        h1 {
            color: #ff3b6b;
            font-size: 2.5rem;
            margin: 0;
            border-right: 3px solid #ff3b6b;
            white-space: nowrap;
            overflow: hidden;
            /* টাইপিং এনিমেশন */
            animation: typing 3s steps(20), blink 0.5s step-end infinite alternate;
        }

        .main-heart {
            font-size: 4rem;
            margin-top: 15px;
            /* ধুকপুক (Pulse) এনিমেশন */
            animation: pulse 0.8s infinite alternate ease-in-out;
        }

        /* ব্যাকগ্রাউন্ডের উড়ন্ত হার্ট এনিমেশন */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: #ff4d6d;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            opacity: 0.7;
        }

        /* Animation Keyframes */
        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            to { transform: scale(1.25); }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Samina I Love You</h1>
        <div class="main-heart">💝</div>
    </div>

    <!-- উড়ন্ত লাভ চিহ্নসমূহ -->
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💖</div>
    <div class="floating-heart" style="left: 25%; animation-delay: 2s; font-size: 30px;">❤️</div>
    <div class="floating-heart" style="left: 40%; animation-delay: 4s;">💕</div>
    <div class="floating-heart" style="left: 60%; animation-delay: 1s; font-size: 35px;">💗</div>
    <div class="floating-heart" style="left: 75%; animation-delay: 3s;">💓</div>
    <div class="floating-heart" style="left: 90%; animation-delay: 5s;">💝</div>

</body>
</html>
